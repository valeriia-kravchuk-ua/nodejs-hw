<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password</title>
</head>
<body
  style="
    margin: 0;
    padding: 0;
    background-color: #f3f4f6;
    font-family: Arial, Helvetica, sans-serif;
    color: #1f2937;
  "
>
  <table
    role="presentation"
    width="100%"
    cellspacing="0"
    cellpadding="0"
    border="0"
    style="background-color: #f3f4f6"
  >
    <tr>
      <td align="center" style="padding: 40px 16px">
        <table
          role="presentation"
          width="100%"
          cellspacing="0"
          cellpadding="0"
          border="0"
          style="
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
          "
        >
          <tr>
            <td style="padding: 40px">
              <h1
                style="
                  margin: 0 0 20px;
                  color: #2563eb;
                  font-size: 28px;
                  line-height: 1.3;
                "
              >
                Hello, {{name}}!
              </h1>

              <p
                style="
                  margin: 0 0 24px;
                  color: #4b5563;
                  font-size: 16px;
                  line-height: 1.6;
                "
              >
                We received a request to reset your password. Click the button
                below to create a new one.
              </p>

              <table
                role="presentation"
                cellspacing="0"
                cellpadding="0"
                border="0"
                style="margin-bottom: 24px"
              >
                <tr>
                  <td
                    align="center"
                    bgcolor="#2563eb"
                    style="border-radius: 8px"
                  >
                    <a
                      href="{{link}}"
                      target="_blank"
                      style="
                        display: inline-block;
                        padding: 14px 24px;
                        color: #ffffff;
                        font-size: 16px;
                        font-weight: bold;
                        line-height: 1;
                        text-decoration: none;
                      "
                    >
                      Reset password
                    </a>
                  </td>
                </tr>
              </table>

              <p
                style="
                  margin: 0 0 12px;
                  color: #6b7280;
                  font-size: 14px;
                  line-height: 1.6;
                "
              >
                If the button does not work, open this link:
              </p>

              <p
                style="
                  margin: 0 0 24px;
                  font-size: 14px;
                  line-height: 1.6;
                  overflow-wrap: anywhere;
                "
              >
                <a href="{{link}}" style="color: #2563eb">{{link}}</a>
              </p>

              <p
                style="
                  margin: 0;
                  padding-top: 20px;
                  border-top: 1px solid #e5e7eb;
                  color: #9ca3af;
                  font-size: 13px;
                  line-height: 1.5;
                "
              >
                If you did not request a password reset, you can safely ignore
                this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
